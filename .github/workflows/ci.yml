name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Compilar aplicación Java
        run: bash app/compile.sh
      - name: Probar clasificador
        run: bash app/run-tests.sh
      - name: Probar clasificador del simulador web
        run: node web/js/classify.test.mjs
