# Bienestar Nexum — todo el proyecto con un comando.
#
#     docker compose up -d --build
#     docker compose ps
#
# POR QUÉ EXISTE ESTE ARCHIVO ADEMÁS DE infra/compose/
# ----------------------------------------------------
# En infra/compose/ viven cuatro archivos que se combinan para los tres
# ambientes (developer, staging, production). Esa separación es la que
# permite afirmar que lo probado en staging es lo que corre en production:
# la imagen es la misma y solo cambian las variables.
#
# Pero para revisar el proyecto, o para que un integrante lo levante en su
# máquina, encadenar tres archivos con --env-file es una fuente de errores
# que no aporta nada. Este archivo es ese camino corto: valores de
# developer escritos a la vista, un solo comando, y ninguna variable que
# haya que recordar.
#
# NO sirve para staging ni production. Tiene contraseñas triviales a la
# vista y publica los puertos de las bases de datos. Para cualquier cosa
# que no sea la máquina de un integrante, se usa infra/compose/.
#
# LO QUE ESTE ARCHIVO NO RELAJA
# -----------------------------
# Los ocho microservicios y el sistema web se conectan a PostgreSQL con el
# rol `bienestar_app`, NUNCA con el superusuario. Eso no es un detalle de
# configuración: es la garantía central del proyecto. El rol de la
# aplicación no tiene permiso de lectura sobre las respuestas individuales,
# y la única ruta hacia los datos agregados pasa por una función que aplica
# ruido de Laplace y descuenta presupuesto de épsilon. Un compose que
# conectara los servicios como `postgres` dejaría esa garantía en el papel
# y no en el motor, que es exactamente lo que el proyecto promete que no
# ocurre.

name: bienestar-nexum

x-entorno-python: &entorno
  APP_AMBIENTE: developer
  PG_HOST: datos
  PG_BASE: bienestar
  # El rol de la aplicación. El superusuario solo lo usa el arranque de la
  # base, dentro del contenedor de PostgreSQL, y nunca un servicio.
  PG_USUARIO: bienestar_app
  PG_CLAVE: desarrollo_local
  REDIS_HOST: cache
  MONGO_URI: mongodb://documentos:27017
  MONGO_BASE: bienestar
  # El MISMO secreto para los nueve componentes: por eso un token emitido
  # por auth-service sirve en catalog-service y un logout revoca en todos.
  JWT_SECRETO: secreto-solo-para-developer-32-bytes
  JWT_MINUTOS: "15"
  NIVEL_BITACORA: INFO
  MOSTRAR_ERRORES: "true"

services:

  # ============================================================ datos
  datos:
    image: postgres:16.13
    environment:
      POSTGRES_DB: bienestar
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: desarrollo_local
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
      # Los scripts de arranque leen estas dos para crear el rol de la
      # aplicación con su contraseña.
      PG_USUARIO: bienestar_app
      PG_CLAVE: desarrollo_local
    volumes:
      - datos_pg:/var/lib/postgresql/data
      # Se montan archivo por archivo y no la carpeta: el entrypoint de
      # PostgreSQL no entra a subdirectorios de initdb.d. El prefijo
      # numérico es el orden de ejecución, y solo corre al crear el volumen.
      #
      # Las cinco migraciones van TODAS. En la versión anterior solo se
      # montaba la 001, de modo que una base recién creada arrancaba sin
      # los códigos de bitácora del sistema web (002), sin la función que
      # registra autoreportes (003), sin el CRUD de catálogos ni los tres
      # permisos nuevos (004) y sin las acciones de reportes y evidencias
      # (005). El sistema levantaba y fallaba al primer uso real.
      - ./db/esquema/00_rol_aplicacion.sh:/docker-entrypoint-initdb.d/00_rol_aplicacion.sh:ro
      - ./db/esquema/01_esquema.sql:/docker-entrypoint-initdb.d/01_esquema.sql:ro
      - ./db/migraciones/001_rol_motor_y_funciones_definer.sql:/docker-entrypoint-initdb.d/02_mig_001.sql:ro
      - ./db/migraciones/002_acciones_del_sistema_web.sql:/docker-entrypoint-initdb.d/03_mig_002.sql:ro
      - ./db/migraciones/003_registrar_autoreporte.sql:/docker-entrypoint-initdb.d/04_mig_003.sql:ro
      - ./db/migraciones/004_catalogos_crud_y_permisos.sql:/docker-entrypoint-initdb.d/05_mig_004.sql:ro
      - ./db/migraciones/005_acciones_de_reportes_y_evidencias.sql:/docker-entrypoint-initdb.d/06_mig_005.sql:ro
      - ./db/migraciones/006_acciones_del_motor_de_reglas.sql:/docker-entrypoint-initdb.d/06b_mig_006.sql:ro
      - ./db/migraciones/007_resultados_de_bitacora.sql:/docker-entrypoint-initdb.d/06c_mig_007.sql:ro
      - ./db/migraciones/008_endurecimiento_privacidad_node.sql:/docker-entrypoint-initdb.d/06d_mig_008.sql:ro
      # Los permisos van DESPUÉS de las migraciones: la 004 crea tablas y
      # columnas sobre las que este script otorga privilegios.
      - ./db/esquema/09_permisos.sh:/docker-entrypoint-initdb.d/07_permisos.sh:ro
      # Datos sintéticos: 1,161 colaboradores en 16 unidades, cinco
      # campañas, agregados ya publicados y un plan de intervención.
      - ./db/semilla/02_volumen_sintetico.sql:/docker-entrypoint-initdb.d/08_semilla.sql:ro
      - ./db/semilla/03_campania_abierta_demo.sql:/docker-entrypoint-initdb.d/09_semilla.sql:ro
      - ./db/semilla/04_agregados_y_riesgo_demo.sql:/docker-entrypoint-initdb.d/10_semilla.sql:ro
      - ./db/semilla/05_intervencion_demo.sql:/docker-entrypoint-initdb.d/11_semilla.sql:ro
    ports:
      # Publicado solo porque esto es developer: permite abrir la base con
      # psql o DBeaver para revisar los permisos. En production el compose
      # de infra/ NO publica este puerto, y la ausencia está comentada ahí
      # como deliberada.
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bienestar"]
      interval: 10s
      timeout: 5s
      retries: 20
      # El arranque completo (esquema + 5 migraciones + semilla de 19,020
      # respuestas) tarda. Sin este margen, los servicios se declaran
      # caídos antes de que la base termine de poblarse.
      start_period: 180s
    networks: [interna]
    restart: unless-stopped

  cache:
    image: redis:7.2-alpine
    command: >
      redis-server
      --appendonly no
      --maxmemory 256mb
      --maxmemory-policy noeviction
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [interna]
    restart: unless-stopped

  documentos:
    image: mongo:7.0
    environment:
      MONGO_INITDB_DATABASE: bienestar
    volumes:
      - datos_mongo:/data/db
      # Índices y validadores $jsonSchema de las siete colecciones. El
      # validador es la última barrera de la regla D-01: si una versión
      # futura de un servicio mandara empleado_id por error, la base
      # rechaza el documento en lugar de guardarlo.
      - ./db/mongo/init.js:/docker-entrypoint-initdb.d/init.js:ro
    ports: ["27017:27017"]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks: [interna]
    restart: unless-stopped

  # ===================================================== sistema web
  web:
    build:
      context: ./apps/web
    environment:
      <<: *entorno
      ALMACEN_EVIDENCIAS: /var/lib/bienestar/evidencias
      EVIDENCIA_TAMANO_MAXIMO: "8388608"
      MICROSERVICIO_TIMEOUT: "2.5"
      # A dónde llama el portal. Si un servicio no responde, cae a
      # PostgreSQL y sigue operando; la pantalla /administracion/servicios
      # permite demostrarlo apagándolos.
      AUTH_SERVICE_URL: http://auth-service:8000
      USERS_SERVICE_URL: http://users-service:8000
      CATALOG_SERVICE_URL: http://catalog-service:8000
      MAIN_PROCESS_SERVICE_URL: http://main-process-service:8000
      DOCUMENTS_SERVICE_URL: http://documents-service:8000
      NOTIFICATIONS_SERVICE_URL: http://notifications-service:8000
      QUERIES_SERVICE_URL: http://queries-service:8000
      REPORTS_SERVICE_URL: http://reports-service:8000
      ALGORITHMS_SERVICE_URL: http://algorithms-service:8000
    volumes:
      # Los archivos de evidencia sobreviven a un docker compose down. En
      # el sistema de archivos del contenedor desaparecerían en el
      # siguiente despliegue, que es justo lo que una evidencia no puede
      # hacer.
      - evidencias:/var/lib/bienestar/evidencias
    ports: ["8000:8000"]
    depends_on:
      datos: {condition: service_healthy}
      cache: {condition: service_healthy}
    networks: [interna]
    restart: unless-stopped

  # ============================================ Integrante 1 (Python)
  auth-service:
    build:
      context: ./apps/microservicios
      dockerfile: auth-service/Dockerfile
    environment: *entorno
    ports: ["8101:8000"]
    depends_on:
      datos: {condition: service_healthy}
      cache: {condition: service_healthy}
    networks: [interna]
    restart: unless-stopped

  users-service:
    build:
      context: ./apps/microservicios
      dockerfile: users-service/Dockerfile
    environment: *entorno
    ports: ["8102:8000"]
    depends_on:
      datos: {condition: service_healthy}
      cache: {condition: service_healthy}
    networks: [interna]
    restart: unless-stopped

  # ============================================== Integrante 2 (Node)
  # Las variables son las MISMAS que los servicios en Python: comun-node
  # las lee con esos nombres a propósito, para que un solo juego de
  # variables levante los ocho. Y se conecta con bienestar_app, igual que
  # todos: el privilegio mínimo no se negocia por lenguaje.
  catalog-service:
    build:
      context: ./apps/microservicios
      dockerfile: catalog-service/Dockerfile
    environment:
      <<: *entorno
      CATALOGO_CACHE_TTL_SEG: "300"
    ports: ["8103:8000"]
    depends_on:
      datos: {condition: service_healthy}
      cache: {condition: service_healthy}
    networks: [interna]
    restart: unless-stopped

  main-process-service:
    build:
      context: ./apps/microservicios
      dockerfile: main-process-service/Dockerfile
    environment: *entorno
    ports: ["8104:8000"]
    depends_on:
      datos: {condition: service_healthy}
      cache: {condition: service_healthy}
      documentos: {condition: service_healthy}
    networks: [interna]
    restart: unless-stopped

  survey-service:
    build:
      context: ./apps/microservicios
      dockerfile: survey-service/Dockerfile
    environment: *entorno
    ports: ["8112:8112"]
    depends_on:
      datos: {condition: service_healthy}
      cache: {condition: service_healthy}
      documentos: {condition: service_healthy}
    networks: [interna]
    restart: unless-stopped

  indicators-service:
    build:
      context: ./apps/microservicios
      dockerfile: indicators-service/Dockerfile
    environment: *entorno
    ports: ["8113:8113"]
    depends_on:
      datos: {condition: service_healthy}
      cache: {condition: service_healthy}
      documentos: {condition: service_healthy}
    networks: [interna]
    restart: unless-stopped

  support-service:
    build:
      context: ./apps/microservicios
      dockerfile: support-service/Dockerfile
    environment: *entorno
    ports: ["8116:8116"]
    depends_on:
      datos: {condition: service_healthy}
      cache: {condition: service_healthy}
      documentos: {condition: service_healthy}
    networks: [interna]
    restart: unless-stopped

  organizational-service:
    build:
      context: ./apps/microservicios
      dockerfile: organizational-service/Dockerfile
    environment: *entorno
    ports: ["8117:8117"]
    depends_on:
      datos: {condition: service_healthy}
      cache: {condition: service_healthy}
    networks: [interna]
    restart: unless-stopped

  # ============================================ Integrante 3 (Python)
  documents-service:
    build:
      context: ./apps/microservicios
      dockerfile: documents-service/Dockerfile
    environment: *entorno
    ports: ["8105:8000"]
    depends_on:
      datos: {condition: service_healthy}
      cache: {condition: service_healthy}
      documentos: {condition: service_healthy}
    networks: [interna]
    restart: unless-stopped

  notifications-service:
    build:
      context: ./apps/microservicios
      dockerfile: notifications-service/Dockerfile
    environment: *entorno
    ports: ["8106:8000"]
    depends_on:
      datos: {condition: service_healthy}
      cache: {condition: service_healthy}
      documentos: {condition: service_healthy}
    networks: [interna]
    restart: unless-stopped

  # ================================= consultas y reportes (Python)
  # queries-service NO depende de MongoDB: solo lee vistas de PostgreSQL y
  # cachea en Redis. Declararlo lo dejaría esperando una base que no usa.
  queries-service:
    build:
      context: ./apps/microservicios
      dockerfile: queries-service/Dockerfile
    environment: *entorno
    ports: ["8107:8000"]
    depends_on:
      datos: {condition: service_healthy}
      cache: {condition: service_healthy}
    networks: [interna]
    restart: unless-stopped

  reports-service:
    build:
      context: ./apps/microservicios
      dockerfile: reports-service/Dockerfile
    environment: *entorno
    ports: ["8108:8000"]
    depends_on:
      datos: {condition: service_healthy}
      cache: {condition: service_healthy}
      documentos: {condition: service_healthy}
    networks: [interna]
    restart: unless-stopped

  # Motor de reglas. Guarda cada corrida en MongoDB, que es donde el
  # proyecto almacena los resultados de algoritmos: sin ese registro, una
  # deteccion de hace tres meses no se puede explicar, porque los umbrales
  # pudieron cambiar desde entonces.
  algorithms-service:
    build:
      context: ./apps/microservicios
      dockerfile: algorithms-service/Dockerfile
    environment: *entorno
    ports: ["8109:8000"]
    depends_on:
      datos: {condition: service_healthy}
      cache: {condition: service_healthy}
      documentos: {condition: service_healthy}
    networks: [interna]
    restart: unless-stopped

networks:
  interna:
    name: bienestar-interna

volumes:
  datos_pg:
  datos_mongo:
  evidencias:
