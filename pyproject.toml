[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "iac-web"
version = "0.1.0"
description = "Sitio web IAC: aplicación monolítica con clasificador de servicios en la nube."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Juan Pablo Ramos" }]
dependencies = [
    "Flask>=3.0.0,<4.0.0",
    "python-dotenv>=1.0.0,<2.0.0",
    "requests>=2.31.0,<3.0.0",
    "gunicorn>=22.0.0,<24.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0,<9.0.0",
    "pytest-cov>=5.0.0,<6.0.0",
]

[project.scripts]
iac-web = "web.cli:main"

[tool.setuptools.packages.find]
include = ["web*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = ["-q", "--tb=short"]
markers = [
    "integration: pruebas que llaman a la API externa",
]

[tool.coverage.run]
source = ["web"]
omit = ["*/tests/*"]
