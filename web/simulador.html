<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Simulador · Clasificador Cloud</title>
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body data-root="." data-page="simulador">
  <div id="site-header"></div>

  <main class="wrap content">
    <header class="page-head">
      <p class="breadcrumb"><a href="index.html">Inicio</a> / Simulador</p>
      <h1>Simulador del clasificador</h1>
      <p class="note">Misma lógica que la app Java: regex y NLP básico, sin LLM. Parte del sitio web; lista para colgarse de un monolito.</p>
    </header>

    <form id="form-clasificar" class="card classify-form">
      <label>
        Nombre
        <input id="nombre" name="nombre" type="text" autocomplete="given-name" required>
      </label>
      <label>
        Apellido
        <input id="apellido" name="apellido" type="text" autocomplete="family-name" required>
      </label>
      <label>
        Descripción del servicio
        <textarea id="texto" name="texto" rows="5" required placeholder="Ejemplo: Desplegar una aplicación web sin administrar servidores"></textarea>
      </label>
      <div class="examples">
        <button type="button" data-example="Máquinas virtuales, almacenamiento y redes para instalar mi propio SO.">IaaS</button>
        <button type="button" data-example="Desplegar una aplicación web sin administrar servidores ni sistemas operativos.">PaaS</button>
        <button type="button" data-example="Correo electrónico en el navegador con suscripción mensual.">SaaS</button>
        <button type="button" data-example="Ejecutar una función cada vez que un usuario suba una imagen.">FaaS</button>
      </div>
      <button type="submit" class="btn">Clasificar</button>
    </form>

    <section id="resultado" class="card" hidden></section>
  </main>

  <footer id="site-footer"></footer>
  <script src="js/classify.js"></script>
  <script src="js/app.js"></script>
  <script src="js/simulador.js"></script>
</body>
</html>
