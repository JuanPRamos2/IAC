<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}IAC{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
</head>
<body>
  <div class="page">
    <header class="site-header">
      <a class="brand" href="{{ url_for('pages.inicio') }}">IAC</a>
      <nav class="nav">
        <a href="{{ url_for('pages.inicio') }}" {% if request.endpoint == 'pages.inicio' %}aria-current="page"{% endif %}>Inicio</a>
        <a href="{{ url_for('pages.clasificador') }}" {% if request.endpoint == 'pages.clasificador' %}aria-current="page"{% endif %}>Clasificador</a>
        <a href="{{ url_for('pages.acerca') }}" {% if request.endpoint == 'pages.acerca' %}aria-current="page"{% endif %}>Acerca</a>
      </nav>
    </header>
    <main>
      {% block content %}{% endblock %}
    </main>
    <footer class="site-footer">
      <p>Aplicación web monolítica lista para crecer. El clasificador es el primer módulo.</p>
    </footer>
  </div>
  {% block scripts %}{% endblock %}
</body>
</html>
